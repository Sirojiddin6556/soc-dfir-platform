[workspace]
resolver = "2"
members = [
    "crates/core-domain",
    "crates/storage-cas",
    "crates/storage-sqlite",
    "crates/workflow-dag",
    "crates/normalization-engine",
    "crates/correlation-engine",
    "crates/evidence-engine",
    "crates/tool-adapters",
    "crates/graph-engine",
    "crates/timeline-engine",
    "crates/taxonomy-projection",
    "crates/scenario-engine",
    "crates/scenario-verifier",
    "crates/scoring-engine",
    "crates/diagram-engine",
    "crates/report-engine",
    "crates/privilege-broker",
    "crates/ipc-protocol",
    "crates/platform-windows",
    "crates/platform-linux",
    "crates/host-snapshot",
    "crates/scan-engine",
    "crates/vulnerability-engine",
    "crates/code-analysis",
    "crates/engine-server", "crates/desktop-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Sirojiddin <sirojiddin@local>"]
license = "Apache-2.0"
repository = "https://github.com/Sirojiddin6556/soc-dfir-platform"

[workspace.dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Cryptography & Hashing
blake3 = "1.5"
sha2 = "0.10"
x509-parser = "0.16"
hex = "0.4"
base64 = "0.22"
argon2 = { version = "0.5", features = ["password-hash"] }
rand_core = { version = "0.6", features = ["getrandom"] }

# Async & Concurrency
tokio = { version = "1.40", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Persistence
rusqlite = { version = "0.32", features = ["bundled", "chrono", "uuid"] }

# Error Handling & Tracing
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
evtx = "0.12"
regex = "1.10"
flate2 = "1.0"
zip = { version = "8.6", default-features = false, features = ["deflate-flate2"] }
ureq = { version = "3.4", default-features = false, features = ["rustls", "platform-verifier", "gzip"] }

# Live host inspection hashes every running executable (and evidence ingest
# hashes uploads); unoptimized SHA-256 makes a dev-build snapshot ~15x slower.
[profile.dev.package.sha2]
opt-level = 3

# Importing an OSV distribution export inflates and parses ~1 GB of JSON;
# unoptimized, that takes about a minute in dev builds instead of seconds.
[profile.dev.package.vulnerability-engine]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3
[profile.dev.package.zip]
opt-level = 3
[profile.dev.package.serde_json]
opt-level = 3
