events {
    worker_connections 1024;
}

http {
    sendfile on;
    tcp_nodelay on;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript;

    # Brute-force protection for the RPC endpoint: 10 requests/s per client.
    limit_req_zone $binary_remote_addr zone=rpc_limit:10m rate=10r/s;

    # Legacy evidence.ingest sends files of up to 256 MiB as base64.
    client_max_body_size 384M;

    upstream engine {
        server engine:8080;
    }

    server {
        listen 80;

        # The engine serves the UI, /rpc, /ingest and /health itself and
        # checks the Host and Origin headers, so they are passed through.
        location / {
            proxy_pass http://engine;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_request_buffering off;
        }

        location = /rpc {
            limit_req zone=rpc_limit burst=40 nodelay;
            proxy_pass http://engine;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 300s;
        }
    }
}
