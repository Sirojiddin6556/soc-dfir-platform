# Runs the engine (UI + API) behind nginx.
#   docker compose -f config/docker/docker-compose.yml up --build
# Then open http://localhost/ and set the owner password on first launch.
# To reach it by another name or IP, set SOC_PUBLIC_HOST, e.g.
#   SOC_PUBLIC_HOST=soc.lab.local docker compose ... up
# Note: inside a container the live host inspection sees the container,
# not the machine running Docker.

services:
  engine:
    build:
      context: ../..
      dockerfile: config/docker/Dockerfile
    image: soc-dfir/engine-server:latest
    restart: unless-stopped
    environment:
      - RUST_LOG=info
      - SOC_ALLOWED_HOSTS=${SOC_PUBLIC_HOST:-localhost}
    volumes:
      - soc_data:/app/data
    networks:
      - internal_net

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      engine:
        condition: service_healthy
    networks:
      - internal_net

volumes:
  soc_data:

networks:
  internal_net:
    driver: bridge
