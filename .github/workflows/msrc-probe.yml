# TEMPORARY: copies real MSRC CVRF documents into the job log (the sandbox
# this feature is developed in cannot reach MSRC). Removed before review.
name: MSRC probe

on:
  pull_request:
    branches: [ "main" ]

jobs:
  cvrf:
    runs-on: ubuntu-latest
    steps:
      - name: Security Update Guide API format
        shell: bash
        run: |
          S='https://api.msrc.microsoft.com/sug/v2.0/en-US/affectedProduct'
          curl -sS -H 'Accept: application/json' "$S?%24filter=cveNumber%20eq%20%27CVE-2024-43572%27" | jq -c '.value[0]'
          for f in "productId%20eq%2012436%20and%20releaseDate%20gt%202026-08-01T00%3A00%3A00Z" "productId%20eq%20%2712436%27" "product%20eq%20%27Windows%20Server%202025%27%20and%20releaseDate%20gt%202026-08-01T00%3A00%3A00Z"; do
            echo "--- filter $f"
            curl -sS -H 'Accept: application/json' -w '\nHTTP %{http_code}\n' "$S?%24filter=$f" | head -c 1500; echo
          done
      - name: Dump CVRF documents
        shell: bash
        run: |
          set -euo pipefail
          B=https://api.msrc.microsoft.com/cvrf/v3.0
          curl -sS -f -H 'Accept: application/json' "$B/updates" -o updates.json
          echo "UPDATES-BEGIN"; jq -c '.value[] | {ID, InitialReleaseDate, CurrentReleaseDate, DocumentTitle}' updates.json; echo "UPDATES-END"
          for id in 2026-Oct 2026-Sep 2026-Aug 2026-Jul 2025-Jan; do
            curl -sS -f -H 'Accept: application/json' -o $id.json "$B/cvrf/$id"
            xz -9e -T0 -c $id.json | base64 -w 4000 > $id.b64
            echo "$id json=$(stat -c %s $id.json) sha256=$(sha256sum $id.json | cut -c1-64) b64=$(stat -c %s $id.b64)"
            echo "DOC-BEGIN $id"; cat $id.b64; echo; echo "DOC-END $id"
          done
