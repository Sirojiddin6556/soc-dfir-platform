name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# A new push to a pull request cancels its older run; runs on main finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: Rust + frontend tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install WebView build dependencies (desktop-app, Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libxdo-dev

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Frontend syntax, XSS and component tests
        run: npm test --prefix apps/desktop-ui

      - name: Check Code Formatting
        run: cargo fmt --all -- --check

      - name: Clippy Linter Check
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Workspace Unit & Integration Tests
        run: cargo test --workspace

  e2e:
    # Starts the real engine-server binary and drives the real UI in Chromium:
    # first-run setup, login, evidence ingest, live host collection, a real
    # vulnerability database download and package CVE scan, every space, with
    # zero console/page errors allowed. On Windows this exercises the
    # PowerShell collectors against a real Windows host.
    name: Real-engine browser E2E (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-e2e-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-e2e-

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build engine-server
        run: cargo build -p engine-server

      - name: Install Playwright Chromium
        working-directory: apps/desktop-ui
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Run end-to-end test
        working-directory: apps/desktop-ui
        env:
          E2E_SCREENSHOTS: ${{ github.workspace }}/e2e-screenshots
          # Runners have open internet: OSV, CISA KEV and FIRST EPSS must all load.
          E2E_REQUIRE_ALL_FEEDS: "1"
        run: |
          mkdir -p "$E2E_SCREENSHOTS"
          node scripts/e2e-real-engine.mjs
        shell: bash

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots-${{ matrix.os }}
          path: e2e-screenshots
          if-no-files-found: ignore

  windows-app:
    # A ready-to-run Windows build: download the artifact, unpack it and
    # start desktop-app.exe. The interface files sit next to it, and the
    # app keeps its data in a `data` folder there.
    name: Windows app package
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-

      - name: Build desktop-app
        run: cargo build --release -p desktop-app

      - name: Assemble the package
        shell: pwsh
        run: |
          $dir = "package/soc-dfir-platform"
          New-Item -ItemType Directory -Force "$dir/apps/desktop-ui" | Out-Null
          Copy-Item target/release/desktop-app.exe $dir/
          Copy-Item -Recurse apps/desktop-ui/index.html, apps/desktop-ui/css, apps/desktop-ui/js "$dir/apps/desktop-ui/"

      - name: The packaged app starts and serves its interface
        shell: pwsh
        working-directory: package/soc-dfir-platform
        run: |
          $app = Start-Process -FilePath .\desktop-app.exe -PassThru
          $ok = $false
          foreach ($i in 1..60) {
            Start-Sleep -Seconds 1
            if ($app.HasExited) { break }
            try {
              $page = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8080/
              $rpc = Invoke-RestMethod -Method Post -Uri http://127.0.0.1:8080/rpc -ContentType 'application/json' `
                -Body '{"jsonrpc":"2.0","id":1,"method":"auth.status","params":{}}'
              if ($page.Content -match 'code' -and $null -ne $rpc.result) { $ok = $true; break }
            } catch { }
          }
          if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force }
          if (-not $ok) { throw "desktop-app.exe did not serve the interface (exited: $($app.HasExited))" }
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue data
          Write-Host "desktop-app.exe serves the interface and answers the engine API"

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: soc-dfir-platform-windows
          path: package
          retention-days: 30

  docker:
    name: Docker image builds and serves the app
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -f config/docker/Dockerfile -t soc-dfir/engine-server:ci .

      - name: Start container and check health, UI and auth gate
        run: |
          docker run -d --name soc -p 127.0.0.1:18080:8080 soc-dfir/engine-server:ci
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' soc)" = "healthy" ] && break
            sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' soc | grep -q healthy
          curl -fsS http://127.0.0.1:18080/ | grep -q "SOC/DFIR"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:18080/rpc \
            -d '{"api_version":1,"request_id":"ci","method":"cases.list","params":{}}')
          test "$code" = "401"
          docker logs soc
