<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOC/DFIR Platform</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/shell.css">
  <link rel="stylesheet" href="css/vulns.css">
  <link rel="stylesheet" href="css/code.css">
  <link rel="stylesheet" href="css/web.css">
</head>
<body>

<div id="socApp" class="soc-app">

  <!-- ===================================================== -->
  <!-- TOP BAR                                               -->
  <!-- ===================================================== -->
  <header class="topbar">
    <div class="topbar-left">
      <div class="product">
        <span class="product-icon">⬡</span>
        <strong>SOC/DFIR ПЛАТФОРМА</strong>
      </div>
    </div>

    <div class="topbar-right">
      <button id="logoutButton" class="icon-button" title="Выйти">⎋ <span id="currentUserName">—</span></button>
    </div>
  </header>

  <!-- ===================================================== -->
  <!-- BODY                                                  -->
  <!-- ===================================================== -->
  <div class="workspace-layout">

    <!-- GLOBAL NAVIGATION -->
    <nav class="global-nav">
      <button data-space="system" class="active">
        ⚙ <span>Система</span>
      </button>
      <button data-space="vulns">
        ⛨ <span>Уязвимости</span>
      </button>
      <button data-space="code">
        ⌨ <span>Анализ кода</span>
      </button>
      <button data-space="web">
        🌐 <span>Запущенный сайт</span>
      </button>
    </nav>

    <!-- ACTIVE SPACE -->
    <main id="spaceContainer" class="space-container"></main>
  </div>

  <!-- ===================================================== -->
  <!-- STATUS BAR                                            -->
  <!-- ===================================================== -->
  <footer class="statusbar">
    <span style="display: inline-flex; align-items: center;"><span class="status-beacon"></span>SOC/DFIR</span>
    <span class="statusbar-spacer"></span>
    <span>Engine: <strong>LOCAL</strong></span>
  </footer>
</div>

<!-- ===================================================== -->
<!-- AUTH: first-run setup and login                       -->
<!-- ===================================================== -->
<div id="authOverlay" class="auth-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="authTitle">
  <form id="authForm" class="auth-card" novalidate>
    <div class="auth-brand">⬡ SOC/DFIR ПЛАТФОРМА</div>
    <h2 id="authTitle">Вход</h2>
    <p id="authHint" class="auth-hint"></p>
    <label id="authUserRow">Имя пользователя
      <input id="authUsername" name="username" autocomplete="username" spellcheck="false">
    </label>
    <label id="authCurrentRow" hidden>Текущий пароль
      <input id="authCurrent" type="password" autocomplete="current-password">
    </label>
    <label>Пароль
      <input id="authPassword" type="password" name="password" autocomplete="current-password">
    </label>
    <label id="authConfirmRow" hidden>Повторите пароль
      <input id="authConfirm" type="password" autocomplete="new-password">
    </label>
    <div id="authError" class="auth-error" role="alert"></div>
    <button type="submit" class="primary-action auth-submit" id="authSubmit">Войти</button>
  </form>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
