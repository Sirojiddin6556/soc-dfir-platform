[package]
name = "remote-scan"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
platform-linux = { path = "../platform-linux" }
host-snapshot = { path = "../host-snapshot" }
vulnerability-engine = { path = "../vulnerability-engine" }

serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
sha2.workspace = true
hex.workspace = true
chrono.workspace = true
base64.workspace = true
rusqlite.workspace = true

# The SSH transport is optional so the workspace core always compiles and is
# testable without a network stack. engine-server turns it on.
russh = { version = "0.45", optional = true }
russh-sftp = { version = "2.0", optional = true }
tokio = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }

[features]
default = []
ssh = ["dep:russh", "dep:russh-sftp", "dep:tokio", "dep:async-trait"]

[dev-dependencies]
zip.workspace = true
tokio = { workspace = true }
